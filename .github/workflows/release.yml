name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 显式指定：action 只读仓库根 packageManager，本仓库无该字段。
          # 版本 8：与本地开发环境及 pnpm-lock.yaml v6.0 对齐（pnpm 11 要求 v9.0 会拒绝）
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # esbuild 产物在 dist/，拷到仓库根供 attest 与 release 上传
          # （manifest.json / styles.css 本就在根目录，无需拷贝）
          cp dist/main.js main.js

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
